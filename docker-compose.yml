version: '3.8'

services:
  # The API service
  api:
    build:
      context: ./dotnet/FlightPredictor.API
      dockerfile: Dockerfile
    container_name: flight-predictor-api
    ports:
      - "5214:80"  # Map host:container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - flight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/prediction/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Placeholder for future services
  # web:
  #   build:
  #     context: ./dotnet/FlightPredictor.Web
  #   ports:
  #     - "5000:80"
  #   depends_on:
  #     - api
  #   networks:
  #     - flight-network

# Define a custom network so services can communicate
networks:
  flight-network:
    driver: bridge