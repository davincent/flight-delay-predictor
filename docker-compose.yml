version: '3.8'

services:
  # The API service
  api:
    build:
      context: ./dotnet/FlightPredictor.API
      dockerfile: Dockerfile
    container_name: flight-predictor-api
    ports:
      - "5214:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - flight-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/api/Prediction/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Define network for service communication
networks:
  flight-network:
    driver: bridge