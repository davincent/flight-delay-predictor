apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flight-predictor-ingress
  namespace: flight-predictor
  labels:
    app: flight-predictor
  annotations:
    # Uncomment and configure based on your ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx  # Change to your ingress controller class (e.g., traefik, nginx, etc.)
  rules:
  - host: flight-predictor.local  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flight-predictor-web
            port:
              number: 80
  # Uncomment for TLS/HTTPS
  # tls:
  # - hosts:
  #   - flight-predictor.local
  #   secretName: flight-predictor-tls
