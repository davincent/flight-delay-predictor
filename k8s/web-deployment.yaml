apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-predictor-web
  namespace: flight-predictor
  labels:
    app: flight-predictor
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flight-predictor
      component: web
  template:
    metadata:
      labels:
        app: flight-predictor
        component: web
    spec:
      containers:
      - name: web
        image: dgvincent/flight-predictor-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: flight-predictor-web
  namespace: flight-predictor
  labels:
    app: flight-predictor
    component: web
spec:
  type: NodePort
  selector:
    app: flight-predictor
    component: web
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
